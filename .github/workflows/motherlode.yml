name: Motherlode supplier import
on:
  pull_request:
    paths:
      - 'discovery/signals.py'
      - 'discovery/enrich.py'
      - 'discovery/rank.py'
      - '.github/workflows/motherlode.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m discovery.signals
      - run: python -m discovery.enrich raw-discoveries.json --limit 100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m discovery.rank enriched.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motherlode-import
          path: |
            raw-discoveries.json
            signals-report.json
            enriched.json
            shortlist.json
